---
name: Fonts
id: modules.fonts
flake: xinux-modules
unique_groups:
  - fonts
description: "Fonts for the system."
version: 0.1.0
icon:
  type: system
  path: start-here-symbolic

options:
  - label: "Windows Fonts"
    id: modules.fonts.windows-fonts
    description: "Install Windows fonts into the system."
    type: !switch
      default: true
  - label: "Nerd Fonts"
    id: modules.fonts.nerd-fonts
    description: "Install whole Nerd Fonts collection."
    type: !switch
      default: false
  - label: "Apple Fonts"
    id: modules.fonts.apple-fonts
    description: "Install Apple made New York and San Francisco fonts."
    type: !switch
      default: false
  - label: "Designers' Choice"
    id: modules.fonts.designer-picked
    description: "Install collection of fonts handpicked by Designers."
    type: !switch
      default: false
