        pkgs.linuxPackages: "LTS Kernel"
        pkgs.linuxPackages_latest: "Latest Kernel"
        pkgs.linuxPackages-libre: "Libre Kernel"
        pkgs.linuxPackages_hardened: "Hardened Kernel"
        pkgs.linuxPackages_zen: "Zen Kernel"
