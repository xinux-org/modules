---
name: Containers
id: modules.container
flake: xinux-modules
unique_groups:
  - development
description: "Container specific configurations."
version: 0.0.1
icon:
  type: system
  path: com.github.taiko2k.avvie-symbolic

options:
  - label: "Containers"
    id: modules.container.enable
    description: "Enable containerization support for the system."
    type: !switch
      default: false

  - label: "Container Provider"
    id: modules.container.provider
    description: "Backend to empower the containers."
    type: !enum
      default: '"docker"'
      options:
        '"podman"': "Podman"
        '"docker"': "Docker"

  # - label: "Templates"
